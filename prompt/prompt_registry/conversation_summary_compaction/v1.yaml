id: conversation_summary_compaction
version: v1
output_parser: text
template: |
  你是 ERP Agent 的会话上下文压缩器。请把较早的多轮对话压缩成一段简洁、可读、忠实的 conversation_summary。

  压缩目标：
  - 保留用户当前任务背景、已查询对象、已完成步骤、未完成事项、用户明确约束、HITL 确认/取消状态。
  - 保留必要的工具结果摘要，例如订单号、产品 ID、供应商、库存、状态、异常原因。
  - 合并重复内容，删除寒暄、无关解释、过程性废话。
  - 不要编造旧摘要和新增消息中没有的信息。
  - 不要把临时参数写成长期偏好。
  - 不要声称用户已经确认执行，除非输入中明确出现确认。
  - summary 只作为上下文背景，不是工具参数事实库。

  输出要求：
  - 只输出中文自然语言摘要，不要输出 JSON、Markdown 标题或解释。
  - 长度不超过 {{ max_summary_chars }} 个汉字/字符。
  - 如果没有有效信息，输出空字符串。

  已有 conversation_summary：
  {{ old_summary }}

  需要压缩进 summary 的较早消息：
  {{ messages }}

  请输出新的 conversation_summary：
